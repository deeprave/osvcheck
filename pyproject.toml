[project]
name = "osvcheck"
version = "0.1.0"
description = "Security vulnerability scanner for Python dependencies"
readme = "README.md"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
osvcheck = "osvcheck:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]
